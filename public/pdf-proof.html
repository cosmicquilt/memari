<meta charset="utf-8">
<title>PDF proof</title>
<style>
  body { margin: 0; padding: 16px; background: #eef2f6; font: 13px system-ui; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  canvas { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.18); width: 380px; height: auto; }
  h1 { font: 600 14px system-ui; margin: 0 0 10px; }
</style>
<body>
<h1 id="h">rendering…</h1>
<div class="row" id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjs from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
  pdfjs.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";
  const url = new URLSearchParams(location.search).get("f") || "/planner-week.pdf";
  try {
    const doc = await pdfjs.getDocument(url).promise;
    const host = document.getElementById("pages");
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      host.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }
    const p1 = await doc.getPage(1);
    const ops = await p1.getOperatorList();
    document.getElementById("h").textContent =
      `${url} — ${doc.numPages} page(s), page 1 has ${ops.fnArray.length} drawing operations`;
    window.__done = true;
  } catch (e) {
    document.getElementById("h").textContent = "FAILED: " + e.message;
    window.__done = "error";
  }
</script>
</body>
